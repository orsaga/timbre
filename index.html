<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timbre Automatico</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-title-group">
                <h1 id="mainTitle">Timbre Automático 🛎️</h1>
                <p id="currentDate" class="date-highlight"></p>
            </div>
            <div class="current-time" id="currentTime">18:41:52</div>
        </header>
        
        <div class="status-panel">
            <div class="status-item">
                <span class="status-label">Estado del timbre:</span>
                <!-- El texto y el color se actualizarán por JavaScript -->
                <span class="status-value" id="timbreStatus">Cargando...</span>
                <button id="toggleTimbre" class="btn">Activar/Desactivar</button>
            </div>
            <div class="status-item">
                <span class="status-label">Configuración activa:</span>
                <select id="activeSchedule" class="select-css">
                    <option value="0">%SCHEDULE1_NAME%</option>
                    <option value="1">%SCHEDULE2_NAME%</option>
                    <option value="2">%SCHEDULE3_NAME%</option>
                </select>
            </div>
            <div class="emergency-box">
                <button id="ringNow" class="btn btn-emergency">¡TIMBRAR!</button>
            </div>
        </div>
        
        <div class="time-settings">
            <h2>Ajustar Hora y Fecha del Sistema</h2>
            <div class="time-inputs">
                <input type="number" id="hourInput" min="0" max="23" placeholder="HH">
                <span>:</span>
                <input type="number" id="minuteInput" min="0" max="59" placeholder="MM">
                <input type="number" id="dayInput" min="1" max="31" placeholder="Día" class="date-input">
                <input type="number" id="monthInput" min="1" max="12" placeholder="Mes" class="date-input">
                <input type="number" id="yearInput" min="2024" max="2050" placeholder="Año" class="date-input">
                <button id="setTimeBtn" class="btn">Ajustar Hora y Fecha</button>
            </div>
        </div>
        
        <div class="time-settings" id="wifiSettings">
            <h2>Red WiFi</h2>
            <p>Conectado a: <strong id="wifiActual">...</strong></p>
            <div class="time-inputs">
                <button id="wifiBuscarBtn" class="btn">Buscar redes</button>
                <select id="wifiLista" class="select-css">
                    <option value="">Elige una red</option>
                </select>
            </div>
            <div class="time-inputs">
                <input type="text" id="wifiSsid" placeholder="Nombre de la red (SSID)">
                <input type="password" id="wifiPass" placeholder="Clave (8 a 63 caracteres)">
                <button id="wifiGuardarBtn" class="btn">Guardar y reiniciar</button>
            </div>
            <p id="wifiMsg" class="wifi-msg"></p>
        </div>

        <div class="time-settings" id="institutionSettings">
            <h2>Nombre de la institución</h2>
            <div class="time-inputs">
                <input type="text" id="institutionInput" maxlength="40" placeholder="Ej: INED Sede Central">
                <button id="saveInstitutionBtn" class="btn">Guardar nombre</button>
            </div>
        </div>

        <div class="tabs">
            <div class="tab-buttons">
                <button class="tab-btn active" data-tab="schedule1">Horario 1</button>
                <button class="tab-btn" data-tab="schedule2">Horario 2</button>
                <button class="tab-btn" data-tab="schedule3">Horario 3</button>
            </div>
            
            <div class="tab-content active" id="schedule1">
                <h2>Horario 1</h2>
                <div class="schedule-config">
                    <div class="schedule-header">
                        <input type="text" id="schedule1Name" class="schedule-name" placeholder="Nombre del horario">
                        <button class="btn save-btn" data-schedule="0">Guardar</button>
                    </div>
                    <div class="bells-container" id="bells1">
                        <!-- Aquí se cargarán dinámicamente los horarios -->
                    </div>
                    <button class="btn add-bell-btn" data-schedule="0">+ Añadir Clase</button>
                </div>
            </div>
            
            <div class="tab-content" id="schedule2">
                <h2>Horario 2</h2>
                <div class="schedule-config">
                    <div class="schedule-header">
                        <input type="text" id="schedule2Name" class="schedule-name" placeholder="Nombre del horario">
                        <button class="btn save-btn" data-schedule="1">Guardar</button>
                    </div>
                    <div class="bells-container" id="bells2">
                        <!-- Aquí se cargarán dinámicamente los horarios -->
                    </div>
                    <button class="btn add-bell-btn" data-schedule="1">+ Añadir Clase</button>
                </div>
            </div>
            
            <div class="tab-content" id="schedule3">
                <h2>Horario 3</h2>
                <div class="schedule-config">
                    <div class="schedule-header">
                        <input type="text" id="schedule3Name" class="schedule-name" placeholder="Nombre del horario">
                        <button class="btn save-btn" data-schedule="2">Guardar</button>
                    </div>
                    <div class="bells-container" id="bells3">
                        <!-- Aquí se cargarán dinámicamente los horarios -->
                    </div>
                    <button class="btn add-bell-btn" data-schedule="2">+ Añadir Clase</button>
                </div>
            </div>
        </div>
    </div>
    <footer class="footer">
        <p>Designed by Daniel Sanchez &copy; 2025</p>
    </footer>
    
    <script src="script.js"></script>

    <style>
        /* Panel WiFi: reutiliza .time-settings, .time-inputs, .select-css y .btn de style.css */
        #wifiSettings p { margin-bottom: 10px; }
        #wifiSettings .time-inputs { margin-bottom: 10px; }
        #wifiSettings input[type="text"],
        #wifiSettings input[type="password"],
        #institutionSettings input[type="text"] {
            flex: 1 1 180px;
            width: auto;
            min-width: 0;
            text-align: left;
        }
        .wifi-msg { min-height: 1.2em; margin: 4px 0 0; color: var(--dark-color); }

        @media (max-width: 768px) {
            #wifiSettings input[type="text"],
            #wifiSettings input[type="password"],
            #institutionSettings input[type="text"] {
                flex: none;
                width: auto;   /* se estira solo por align-items: stretch de .time-inputs */
            }
        }
    </style>

    <script>
    (function () {
        const $ = id => document.getElementById(id);
        const msg = t => { $('wifiMsg').textContent = t; };

        async function cargarWifiActual() {
            try {
                const r = await fetch('/api/wifi/current');
                const d = await r.json();
                $('wifiActual').textContent = d.connected ? d.ssid : 'Sin conexion (modo punto de acceso)';
            } catch (e) {
                $('wifiActual').textContent = 'No se pudo consultar';
            }
        }

        async function buscarRedes() {
            msg('Buscando redes...');
            $('wifiBuscarBtn').disabled = true;
            try {
                for (let i = 0; i < 12; i++) {
                    const r = await fetch('/api/wifi/scan');
                    const d = await r.json();
                    if (!d.scanning) {
                        const lista = $('wifiLista');
                        lista.innerHTML = '<option value="">Elige una red</option>';
                        [...new Set(d.networks)].forEach(n => {
                            const o = document.createElement('option');
                            o.value = n;
                            o.textContent = n;
                            lista.appendChild(o);
                        });
                        msg(d.networks.length + ' redes encontradas');
                        return;
                    }
                    await new Promise(res => setTimeout(res, 1000));
                }
                msg('No se encontraron redes. Intenta de nuevo.');
            } catch (e) {
                msg('Error al buscar redes');
            } finally {
                $('wifiBuscarBtn').disabled = false;
            }
        }

        async function guardarWifi() {
            const ssid = $('wifiSsid').value;
            const password = $('wifiPass').value;
            if (!ssid) { msg('Escribe o elige el nombre de la red'); return; }
            if (!confirm('El timbre se reiniciara para conectarse a "' + ssid + '". Continuar?')) return;
            try {
                const r = await fetch('/api/wifi/set', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({ ssid: ssid, password: password })
                });
                msg(await r.text());
            } catch (e) {
                msg('No se pudo guardar');
            }
        }

        $('wifiBuscarBtn').addEventListener('click', buscarRedes);
        $('wifiLista').addEventListener('change', () => { $('wifiSsid').value = $('wifiLista').value; });
        $('wifiGuardarBtn').addEventListener('click', guardarWifi);
        cargarWifiActual();
    })();
    </script>
</body>
</html>
